ENVIRONMENT:
  MAX_EPISODE_STEPS: 100 
SIMULATOR:
  ACTION_SPACE_CONFIG: v0
  AGENT_0:
    SENSORS: [RGB_SENSOR, DEPTH_SENSOR]
  FORWARD_STEP_SIZE: 0.25
  TURN_ANGLE: 15
  HABITAT_SIM_V0:
    GPU_DEVICE_ID: 0
    ALLOW_SLIDING: True
  RGB_SENSOR:
    WIDTH: 896
    HEIGHT: 672
    HFOV: 90
  DEPTH_SENSOR:
    WIDTH: 896
    HEIGHT: 672
TASK:
  TYPE: PWGW-Nav
  SUCCESS_DISTANCE: 1.0 
  SENSORS: [HINT_POSITION_SENSOR, HINT_SENSOR, HINT_LANGUAGE_SENSOR, REFERENCE_PATH_SENSOR, SHORTEST_PATH_SENSOR]
  POSSIBLE_ACTIONS: [STOP, MOVE_FORWARD, TURN_LEFT, TURN_RIGHT]
  MEASUREMENTS: [DISTANCE_TO_GOAL, SUCCESS, SPL, NDTW, SDTW, PATH_LENGTH, ORACLE_SUCCESS, STEPS_TAKEN, CORRECT_SIGN_FOLLOW_COUNT]
  GLOBAL_GPS_SENSOR_UUID: global_gps
  SUCCESS:
    SUCCESS_DISTANCE: 1.0 
  ORACLE_SUCCESS:
    SUCCESS_DISTANCE: 1.0 
  SPL:
    SUCCESS_DISTANCE: 1.0 
  NDTW:
    GT_PATH: data/datasets/PWGW/{split}/{split}_gt.json.gz
    SUCCESS_DISTANCE: 1.0 
DATASET:
  TYPE: PWGW-CE
  SPLIT: train
  DATA_PATH: data/datasets/PWGW/{split}/{split}.json.gz
  SCENES_DIR: data/scene_datasets/
